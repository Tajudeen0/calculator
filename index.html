<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="calculator-body">
        <div class="display">
            <div class="input-line">
                <p class="line-text input-text"></p>
            </div>
            <div class="result-line">
                <p class="line-text result-text"></p>
            </div>    
        </div>
        
        <div class="buttons">
            <div class="section">
                <button class="btn op-btn ">CLR</button>
                <button class="btn op-btn ">DEL</button>
                <button class="btn ftn-btn ">/</button>
            </div>

            <div class="section">
                <button class="btn nb">7</button>
                <button class="btn  nb">8</button>
                <button class="btn  nb">9</button>
                <button class="btn  ftn-btn">x</button>
            </div>

            <div class="section">
                <button class="btn  nb">4</button>
                <button class="btn  nb">5</button>
                <button class="btn  nb">6</button>
                <button class="btn  ftn-btn">-</button>
            </div>
            <div class="section">
                <button class="btn  nb">1</button>
                <button class="btn  nb">2</button>
                <button class="btn  nb">3</button>
                <button class="btn  ftn-btn">+</button>
            </div>

            <div class="section">
                <button class="btn nb">.</button>
                <button class="btn nb">0</button>
                <button class="btn  op-btn">=</button>
            </div>
        </div>


    </div>
</body>
</html>
